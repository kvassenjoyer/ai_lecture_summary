[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-lecture-summary"
version = "0.1.0"
description = "Local lecture transcription and source-grounded notes with Whisper and Qwen"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "python-multipart>=0.0.20", "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0.36,<3", "psycopg[binary]>=3.2,<4",
  "boto3>=1.36,<2", "numpy>=2.1,<3",
  "torch>=2.10,<3", "transformers>=5.3,<6",
  "accelerate>=1.5,<2", "bitsandbytes>=0.49,<1",
  "safetensors>=0.5", "huggingface-hub>=1.0,<2",
  "yt-dlp[default]>=2026.1.1", "httpx>=0.28,<1", "filelock>=3.18,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.28", "ruff>=0.11"]

[tool.hatch.build.targets.wheel]
packages = ["lecture_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=data/pytest-tmp --tb=short"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
